<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; width: 358px; border: 2px solid red; padding: 8px; }
.grid > div { background: #ccc; padding: 20px; }
@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr !important; gap: 8px !important; }
}
</style></head>
<body>
<div class="grid">
  <div>A</div><div>B</div>
</div>
</body></html>
