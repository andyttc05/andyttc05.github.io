<meta name="description" content="时雨时猫的个人编程主页 — 从零开始学编程的旅程记录">
<meta name="theme-color" content="#f8fafc">
<title>rain.meow</title>
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('rainmeow-theme'); } catch (e) {}
    var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('theme-dark', dark);
    /* 同步设好 meta theme-color，避免 dark 用户首屏看到亮色地址栏闪一下 */
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#f8fafc');
  })();
</script>
<!-- 首屏防闪烁：把图标切换规则提前到内联 style，body 渲染前就生效，
     不依赖外部 style.css（图标规则在第 367 行，CSS 没应用完时两个 SVG 会同时可见） -->
<style>
  .icon-sun { display: none; }
  .icon-moon { display: block; }
  .theme-dark .icon-sun { display: block; }
  .theme-dark .icon-moon { display: none; }
</style>

<main>
  <!-- === Hero 区：二次元风格 · 左内容 + 右立绘 · 电影感转场 === -->
  <section class="hero" id="hero">
    <!-- 左：内容 -->
    <div class="hero-text">
      <p class="hero-welcome">WELCOME TO</p>
      <h1 class="hero-title">
        <span class="hero-title-text" aria-label="时雨时猫"><span class="hero-title-char">时</span><span class="hero-title-char">雨</span><span class="hero-title-char">时</span><span class="hero-title-char">猫</span></span>
      </h1>
      <p class="hero-sub">在雨里编程，在代码里听雨。记录从零到一的成长，也分享每一个晴朗的日常。</p>
      <p class="hero-type" aria-label="循环播放的句子">
        <span class="hero-type-text" id="typewriter" aria-live="off"></span><span class="hero-type-caret" aria-hidden="true"></span>
      </p>
      <div class="hero-meta" id="heroMeta">
        <p class="hero-meta-line">
          <span id="heroTime">--:--:--</span>
          <span class="hero-greet" id="heroGreet">安安</span>
        </p>
        <p class="hero-meta-line">
          <span id="heroDate">----年--月--日</span><span class="hero-meta-sep" aria-hidden="true">·</span>
          <span id="heroLoc">香港</span><span class="hero-meta-sep" aria-hidden="true">·</span>
          <span id="heroWeather">天气 --</span>
        </p>
      </div>
    </div>

    <!-- 右：立绘卡片（微歪 + 后置双层柔光 echo + 左下打底，视频在 assets/videos/hero-{desktop,mobile}.{webm,mp4}，webp/jpg 作 poster） -->
    <div class="hero-art">
      <div class="hero-art-base" aria-hidden="true"></div>
      <div class="hero-art-card">
        <video class="hero-art-img hero-art-video"
          muted loop playsinline
          preload="metadata"
          poster="assets/images/hero-poster.webp?v=2"
          width="1112" height="834"
          aria-label="动态立绘：雨中的少女，循环播放">
          <source src="assets/videos/hero-desktop.webm?v=11" type="video/webm">
          <source src="assets/videos/hero-desktop.mp4?v=11" type="video/mp4">
        </video>
      </div>
    </div>

    <!-- 底部滚动指示：SCROLL TO EXPLORE + 向下箭头（纯静态，无动画） -->
    <a class="hero-scroll" href="#explore" aria-label="向下滚动探索">
      <span class="hero-scroll-text">SCROLL TO EXPLORE</span>
      <span class="hero-scroll-arrow" aria-hidden="true">&darr;</span>
    </a>
  </section>

  <!-- === 过渡带：落眸笑歌触 五字目录（hero → 内容流 的 pinned 门） ===
       外层 .story-pin 高 = 100vh + 900px 滚动区（--pin-scroll，JS 同步读取）：
       滚到过渡带 → sticky 钉住（页面视觉不动）→ 向下滚字依次滑出 / 向上滚字依次滑入
       → 全部字+副标题滑出后（900px 滚完）sticky 释放，才进入下一区域 -->
  <section class="story-pin">
    <section class="story-intro" id="explore" aria-label="五个瞬间：落眸笑歌触">
      <p class="story-intro-eyebrow">五 · 幕 · 雨</p>
      <p class="story-intro-glyphs">
        <span class="gi" data-anim="fall">落</span><span class="gi-sep" aria-hidden="true">·</span>
        <span class="gi" data-anim="focus">眸</span><span class="gi-sep" aria-hidden="true">·</span>
        <span class="gi" data-anim="bloom">笑</span><span class="gi-sep" aria-hidden="true">·</span>
        <span class="gi" data-anim="swing">歌</span><span class="gi-sep" aria-hidden="true">·</span>
        <span class="gi" data-anim="reach">触</span>
      </p>
      <p class="story-intro-sub">五个瞬间，一场雨</p>
    </section>
  </section>

</main>

<!-- nav 已解析完，立即设好主题文字 label，避免 dark 用户先看到"Dark"（深色背景深色文字）闪一下。
     必须在 nav 之后、script.js 之前——同步执行，不依赖外部 JS 加载 -->
<script>
  (function () {
    var dark = document.documentElement.classList.contains('theme-dark');
    var label = dark ? 'Light' : 'Dark';
    var d = document.getElementById('themeLabelDesktop');
    var m = document.getElementById('themeLabelMobile');
    if (d) d.textContent = label;
    if (m) m.textContent = label;
  })();
</script>

<script src="assets/js/script.js?v=60"></script>
<!-- 几何粒子点线网络背景（源自 bistutzyy.github.io 的 canvas-nest 效果）。
     不写 color 属性 → 自动用主题 accent 色；切换主题时由 script.js 联动更新 -->
<script id="canvas_nest" defer="defer" opacity="0.6" zIndex="-1" count="99" mobile="true" src="assets/js/canvas-nest.js?v=3"></script>
<!-- 动态几何飘带背景（源自 bistutzyy.github.io 的 canvas-fluttering-ribbon / Ribbons 效果）。
     单色 accent 版，全屏滚动视差；切换主题时由 script.js 联动更新 -->
<script id="fluttering_ribbon" defer="defer" src="assets/js/canvas-ribbons.js?v=3"></script>
</body>
