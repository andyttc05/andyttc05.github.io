<script>
  (function () {
    var de = document.documentElement;
    var internal = false;
    /* ① 主判据 referrer 同源 = 从站内某页点进来。不依赖任何存储、同步可读 ——
       实测 sessionStorage 在本页 head 里偶发取不到（12 次里 2 次抛错），
       所以存储只当兜底，不当主判据。 */
    try {
      if (document.referrer) {
        var a = document.createElement('a');
        a.href = document.referrer;
        internal = a.origin === location.origin;
      }
    } catch (e) {}
    /* ② 本次会话已经看过至少一页：referrer 被策略剥掉（外部 no-referrer 等）时兜底 */
    try {
      if (sessionStorage.getItem('rm-visited') === '1') internal = true;
      else if (!document.prerendering) sessionStorage.setItem('rm-visited', '1');
    } catch (e) {}
    if (internal) de.classList.add('nav-instant');
  })();
</script>

/* ---- 朋友圈标准图片网格（v9.10 · 版式 A：栏内满宽与正文同宽） ---- */
.dy-images {
  width: 100%; margin: 16px 0 0;
  display: grid;
}
.dy-img {
  position: relative; overflow: hidden; cursor: zoom-in;
  aspect-ratio: 1/1; border-radius: 6px;

     照片格走下面 .is-photo 那套全站统一的空图片底板 */
  background:

/* 空图片底板（2026-09-21 主人「所有有图片显示的都要同步，动态的照片还没同步」）：
   照片格不再用 12 色渐变，改用 style.css 里那三枚 token —— 与相簿封面 / 单册照片墙 /
   首页立绘卡 / 项目轮播帧完全是同一套（改底板只改 style.css 的 :root）。
   ⚠️ `background-color` + `background-image` 分开写：简写会把上面那两层渐变一起冲掉，
   而这里只想换掉渐变、保留 --color-alt 兜底。 */
.dy-img.is-photo {
  background-color: var(--color-alt);
  background-image: var(--plate-grad);
  box-shadow: var(--plate-edge);
}
/* v9.26 悬停微放大（图库通用 hover-zoom 设计，见 grid hover-zoom 惯例）：
   只动内层图片 transform —— GPU 合成、不触发 layout；父格 overflow:hidden
   把放大后的图裁回圆角框，不影响相邻格与整体布局。
   2026-09-21：参数抽到 style.css 的 --zoom-scale / --zoom-in / --zoom-out，
   与相簿封面、单册照片墙共用同一组值（数档从 1.05 不变，改的是节奏：
   进 0.6s 铺开、出 0.4s 收回，去掉原来进出同 0.5s 的"平均感"）。
   原 hover 为整格 filter 增亮 → 按主人要求改为图片微放大动画。
   hover:hover 门控：触屏无悬停态，不产生"点一下卡在放大"的残留。 */
.dy-img > img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block; border-radius: inherit;
  /* 图到位时从底板淡入（--img-fade，与相簿 / 项目帧同一个 0.4s）；
     transform 那条照旧给 hover 微放大。
     ⚠️ 基础规则里就带上 opacity —— 触摸设备没有 hover 分支，淡入也得生效。 */
  transition: var(--img-fade), transform var(--zoom-out, 0.4s ease);
}
/* 淡入的两个状态（本页脚本的 fadeInImg() 挂）：
   .is-pending = 图还没到、压在透明上（底板露出来）→ 去掉它即 0→1 淡入。
   没有这两个类时默认 opacity 1 —— 脚本没跑起来照片照常显示，不会卡在透明。 */
.dy-img > img.is-pending { opacity: 0; }
.dy-img > img.is-loaded { opacity: 1; }
@media (hover: hover) {
  /* 这里原来还有一条 `.dy-img > img { transition: transform var(--zoom-out,.4s) }`
     —— 2026-09-21 给 img 补淡入时并进基础规则了，同值重复，删掉。 */
  .dy-img:hover > img,
  .dy-img:focus-visible > img,
  .dy-img:focus-within > img {
    transform: scale(var(--zoom-scale, 1.05));
    /* opacity 一起带上：transition 是整条替换，只写 transform 会把淡入踢掉 */
    transition: var(--img-fade), transform var(--zoom-in, 0.6s ease);
  }
}
@media (prefers-reduced-motion: reduce) {

     压不过 `.dy-img:hover > img` (0,2,1)，只写前者等于没写。 */
  .dy-img > img,
  .dy-img:hover > img,
  .dy-img:focus-visible > img,
  .dy-img:focus-within > img { transition: none; }
}
/* 「+N 更多」叠加层：覆盖在第 9 张格子上。

/* 图片网格（v9.10 · 版式 A）：栏内一律与正文同宽满栏 —— 图文零缝隙。
   栏本身 ~680，故 3×3 单格 ≈221px（朋友圈原始尺寸，不再显大）。 */
/* 1 张：单图 4:3，插图式 */

/* 3 张：左大（占 2/3 宽、跨两行）+ 右 2 小 */

/* 4 张：2×2 */

/* ==== 灯箱 CSS 已抽到 assets/css/lightbox.css（2026-09-21，与相册页同一份）====

   要查"为什么 32px / 为什么 band 要反算"就去那个文件读。 */

/* ---- 入场 / 出场：滚动驱动（2026-09-16 主人「加入滑动时内容进入/出去的动画，参考「关于」页」）----
   改前：一次性入场（IntersectionObserver 加 .is-visible 后 unobserve）——
   只进不出，滚过去就再也没有后半场。现在与「关于」页同一套：**滚动位置就是动画进度**，
   进（下方升入 + 淡入 + 微缩）与出（升到导航栏下方淡出）都由 view() 时间轴连续驱动。

   基础态 = 全显（不再是 opacity:0）。CSS 动画的优先级高于普通声明，所以支持
   view() 的引擎由动画接管；不支持的引擎退回下面 @supports not 里那套老办法。 */
.dy-item, .dy-day { opacity: 1; transform: none; }

/* 老引擎回退（无 animation-timeline: view()：iOS Safari ≤17 / 老 Chrome / 部分 WebView）：
   保留原来的一次性 IO 入场（.is-visible 由页尾 initEntrance 写），只进不出。
   ⚠️ 必须门控：不门控的话基础态 opacity:0 在没有动画的引擎里会让整条内容流不可见。 */
@supports not (animation-timeline: view()) {
  .dy-item, .dy-day {
    opacity: 0; transform: translateY(12px);
    transition: opacity .5s cubic-bezier(0.22,1,0.36,1), transform .5s cubic-bezier(0.22,1,0.36,1);
  }
  .dy-item.is-visible, .dy-day.is-visible { opacity: 1; transform: none; }
}

/* === 滚动驱动进出场（与「关于」页同一套机制）===
   keyframes 复用 style.css 的 scroll-fade-opacity / scroll-fade-move（本站通用运动语言，
   别在本页另写一套，否则两页手感会分叉）：
     scroll-fade-opacity  opacity 0 → 7% 全显 → 80% 仍全显 → 100% 淡尽（composition: replace）
     scroll-fade-move     0% translateY(var(--enter-y,48px)) scale(var(--enter-s,.96)) → 7% 归位（add）
   view(block 100px)：视口上下各内缩 100px，把"出"的落点抬到导航栏（64px）下方 ——
   与「关于」页同一个数，同一理由（别让淡出发生在导航栏遮挡区里，用户看不见）。
   ⚠️ 位置必须在本块**下面**那条 .dy-arrive 之前：.dy-arrive 的 animation 简写会把
      animation-timeline 复位成 auto，"同特异性 + 后写覆盖"才能让落地动画接管住。
      顺序一反，点目录跳转的落地入场会被这里吃掉。 */
@supports (animation-timeline: view()) {
  .dy-item, .dy-day {
    animation:
      scroll-fade-opacity linear both,
      scroll-fade-move linear both;
    animation-timeline: view(block 100px), view(block 100px);
    animation-range: entry 0% cover 100%, entry 0% cover 100%;
    animation-composition: replace, add;
  }
  /* 日期头**只进不出** —— 「关于」页没有的东西，本页必须有。
     时间轴的进度是几何算出来的：p = (视口下内缩线 − 元素top) / (可视高 + 元素高)。
     日期头只有 20px 高，而点月份目录的落点被 .dy-day 的 scroll-margin-top 钉在
     **top = 88px**（= nav 64 + 24），代进去
         inset 100 ⇒ p = (800 − 88) / (700 + 20) = 0.989
         inset  64 ⇒ p = (836 − 88) / (772 + 20) = 0.944
     都躺在"淡出段"（80%~100%）里 —— 实测落地后 dyDock 一撤，日期头就被自己的淡出段
     抓回去，opacity 掉到 **0.055**（几乎看不见）。这不是调参能救的：hold 提到 93 也只到
     0.79，提到 98 才勉强全显，而那样一来整条的退场就没了。
     所以日期头单独换成"只进不出"的 keyframes —— 20px 的 hairline 行本来也没有
     "退场"可言（它退场只有 20px 的行程，读起来是闪一下而不是动），
     而且它同时是月份目录高亮跟随的锚点，保持实心更对。
     ⚠️ 条目（500~1000px）不换：它们的淡出发生在 280~380px 可见时，是真正的"在离场"。
     数值全部来自探针实测（~/.workbuddy/scratch/posts-scroll/），不是估算。 */
  .dy-day {
    animation-name: dy-fade-in, scroll-fade-move;
  }
}
@keyframes dy-fade-in {
  0%   { opacity: 0; }
  7%   { opacity: 1; }
  100% { opacity: 1; }
}

   ⚠️ 不复用 .is-visible：那条过渡带着入场 stagger 写在元素上的 inline
      transition-delay，直接复用会把旧 delay 一起带回来（落地后还在慢慢等）。

  to   { opacity: 1; transform: none; }

.dy-arrive { animation: dyDock .52s cubic-bezier(0.22, 1, 0.36, 1) both; }

@media (max-width: 920px) {
  .dy-layout { display: block; }
  .dy-side { display: none; }
  .dy-stream { width: 100%; }
}

@media (max-width: 760px) {
  .dy-day { margin-top: clamp(30px, 6vw, 42px); }
  .dy-text { font-size: 16px; }
  .dy-text.collapsed { -webkit-line-clamp: 4; }
  .dy-images.dy-c1 { max-width: 100%; }
  .dy-images.dy-c1 .dy-img { border-radius: 8px; }

   scale 0.96→0.98）——理由与关于页写下的完全一样：窄屏视口矮，100px inset 会让

  @media (max-width: 768px) {
    .dy-item, .dy-day {

      --enter-y: 28px;
      --enter-s: 0.98;
    }

   让内容直接全显。支持 view() 的引擎不受影响：CSS 动画优先级高于普通声明，
   滚动驱动的进出场照跑（站内约定，见 .dy-arrive 上方那段说明）。
   ⚠️ 别在这里写 animation: none —— 主人系统正是开着「减弱动态」，
      那样等于把他刚点名要的动画静默关掉。 */
@media (prefers-reduced-motion: reduce) {
  .dy-item, .dy-day { opacity: 1; transform: none; }
}

          resolve((window.__DY_POSTS && window.__DY_POSTS.posts) || []);
        };
        s.onerror = function () { reject(new Error('无法加载 ' + url)); };
        document.head.appendChild(s);
      });
    }

    /* ---------- 渲染 ---------- */
    function buildItem(post) {
      var d = toDate(post.date);
      var valid = !isNaN(d);
      var item = el('article', 'dy-item' + (post.quote ? ' is-quote' : ''));

      if (post.text) item.appendChild(el('p', 'dy-text', post.text));

      var photos = post.photos || [];
      if (photos.length) {
        var visible = Math.min(photos.length, 9);
        var grid = el('div', 'dy-images ' + gridClass(visible));
        var i;
        for (i = 0; i < visible; i++) {
          var ph = photos[i];
          /* 有照片的格子挂 .is-photo ⇒ 走全站统一的空图片底板（见本页 <style>）；
             没有照片的（emoji 格）保留 12 色渐变 —— 那不是"图没到"，是设计好的色块。 */
          var tile = el('div', 'dy-img' + (ph.src ? ' is-photo' : '') + ' ' + (ph.tone || 'dy-g1'));
          tile.dataset.idx = String(i);
          if (ph.src) {
            var img = document.createElement('img');
            img.src = ph.src;
            img.alt = ph.alt || '';
            img.loading = i === 0 ? 'eager' : 'lazy';
            img.decoding = 'async';
            fadeInImg(img);
            tile.appendChild(img);
          } else if (ph.emoji) {
            tile.appendChild(document.createTextNode(ph.emoji));
          }
          /* 第 9 格叠加「+N 更多」蒙层（N = 隐藏的张数） */
          if (i === 8 && photos.length > 9) {
            tile.classList.add('is-more');
            var more = el('span', 'dy-more', '+' + (photos.length - 9));
            more.appendChild(el('small', '', '更多'));
            tile.appendChild(more);
          }
          grid.appendChild(tile);
        }
        item.appendChild(grid);
      }

      /* 让灯箱拿到本条的全部照片 + 索引（不局限于前 9 张） */
      item._dyPhotos = photos;

      var t = el('time', 'dy-time', valid ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : '');
      if (valid) { t.setAttribute('datetime', post.date); t.title = fmtFull(d); }
      item.appendChild(t);
      return item;
    }

    function render(posts) {
      var wrap = document.getElementById('dyList') || document.querySelector('.dy-list');
      var empty = document.getElementById('dyEmpty');
      if (!wrap) return;

      var list = posts.slice().sort(function (a, b) {
        return toDate(b.date) - toDate(a.date);
      });
      if (!list.length) { if (empty) empty.hidden = false; return; }
      if (empty) empty.hidden = true;

      var now = new Date();
      var frag = document.createDocumentFragment();
      var lastDayKey = null;
      var lastMonthKey = null;
      var months = [];   /* 新→旧：[{y,m}] 有动态的月份 */
      var counts = {};   /* 'y-mm-dd' -> 当日条数（喂迷你月历） */

      list.forEach(function (post) {
        var d = toDate(post.date);
        var dayKey = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        var monKey = d.getFullYear() + '-' + pad(d.getMonth() + 1);
        counts[dayKey] = (counts[dayKey] || 0) + 1;

        if (dayKey !== lastDayKey) {
          lastDayKey = dayKey;
          var head = el('div', 'dy-day');
          head.id = 'dy-d-' + dayKey;
          if (monKey !== lastMonthKey) {
            lastMonthKey = monKey;
            months.push({ y: d.getFullYear(), m: d.getMonth() + 1 });
          }
          var label = (d.getFullYear() !== now.getFullYear() ? d.getFullYear() + '年' : '') +
                      (d.getMonth() + 1) + '月' + d.getDate() + '日';
          head.appendChild(el('span', 'dy-day-label', label));
          head.appendChild(el('span', 'dy-day-wk', WEEK[d.getDay()]));
          head.appendChild(el('span', 'dy-day-line'));
          frag.appendChild(head);
        }
        frag.appendChild(buildItem(post));
      });

      wrap.appendChild(frag);
      fillCal(months, counts, list.length);
    }

    /* ---------- 右侧索引：文字月份目录（原本内容）+ 单一迷你月历 ---------- */
    var calYears = {};    /* mkey('y-mm') -> {y,m}，有动态的月份 */
    var calCounts = {};   /* 'y-mm-dd' -> 当日条数 */
    var topYear = 0;      /* 最新月份所在年（年份头） */
    var curMKey = null;   /* 月历当前展示的月份 */

    function monthCount(y, m, counts) {
      var pre = y + '-' + pad(m) + '-', n = 0, k;
      for (k in counts) {
        if (counts.hasOwnProperty(k) && k.indexOf(pre) === 0) n += counts[k];
      }
      return n;
    }

    function fillCal(months, counts, total) {
      var side = document.getElementById('dySide');
      if (!side || !months.length) return;
      calCounts = counts;
      calYears = {};
      months.forEach(function (m) { calYears[m.y + '-' + pad(m.m)] = m; });
      topYear = months[0].y;

      document.getElementById('dyIdxYear').textContent = String(topYear);

      var ml = document.getElementById('dyMl');
      ml.innerHTML = '';
      months.forEach(function (m) {
        var row = el('button', 'dy-ml-row');      /* button：键盘可达的目录项 */
        row.type = 'button';
        row.setAttribute('data-mkey', m.y + '-' + pad(m.m));
        row.appendChild(el('span', 'dy-ml-dot'));
        row.appendChild(el('span', 'dy-ml-name', MONTH[m.m - 1]));
        if (m.y !== topYear) row.appendChild(el('span', 'dy-ml-yr', String(m.y)));
        row.appendChild(el('span', 'dy-ml-lead'));   /* v9.6 点线：把月名与条数连起来 */
        row.appendChild(el('span', 'dy-ml-n', String(monthCount(m.y, m.m, counts))));
        ml.appendChild(row);
      });

      setActiveMonth(months[0].y + '-' + pad(months[0].m));
      document.getElementById('dySideFoot').innerHTML = '共 <b>' + total + '</b> 条动态';
      side.hidden = false;
    }

    /* 切换当前月：文字目录高亮 + （必要时）换月历 */
    function setActiveMonth(mkey) {
      Array.prototype.forEach.call(document.querySelectorAll('.dy-ml-row'), function (r) {
        r.classList.toggle('is-active', r.getAttribute('data-mkey') === mkey);
      });
      if (mkey !== curMKey) swapCal(mkey);
    }

    /* 换月历：先让旧的淡出，再落新的，再淡回来（v9.6）。
       ⚠️ 淡出期间又来了新的月份（快速滚动 / 连点目录）**不排队**，直接改记
          「最新那个」—— 排队会让日历一路放旧月份，是本末倒置。
       ⚠️ 首绘不做动画（`!cal.firstChild`）：那是页面刚渲染，不是"切换"。
       ⚠️ 程序化跳转途中（`jumping`）**一次都不重绘**：跨月跳转会在 900ms 里
          路过三四个日期头，逐月淡入淡出等于让日历全程半透明地闪；飞行中没人看得
          清日历，落地后 `updateSpy()` 再补一次淡入就够了 —— 高亮条照旧一路跟着走。 */
    var calSwapping = false, calPending = null;
    function swapCal(mkey) {
      if (!calYears[mkey] || mkey === curMKey || jumping) return;
      var cal = document.getElementById('dyCal');
      if (!cal.firstChild) { buildCal(mkey); return; }
      if (calSwapping) { calPending = mkey; return; }
      calSwapping = true;
      cal.classList.add('is-swap');
      setTimeout(function () {
        if (calPending !== null) { mkey = calPending; calPending = null; }
        buildCal(mkey);
        requestAnimationFrame(function () {
          cal.classList.remove('is-swap');
          calSwapping = false;
        });
      }, 170);                                    /* = .is-swap 的 .18s，留一点余量 */
    }

    /* 落一张月历（周一开头；有记日子点亮、可点击跳当天）。纯重建，不带动画。 */
    function buildCal(mkey) {
      var m = calYears[mkey];
      if (!m) return;
      curMKey = mkey;
      var cal = document.getElementById('dyCal');
      cal.innerHTML = '';

      var head = el('header', 'dy-cal-head');
      head.appendChild(el('span', '', MONTH[m.m - 1]));
      if (m.y !== topYear) head.appendChild(el('span', 'dy-cal-yr', String(m.y)));
      cal.appendChild(head);

      var grid = el('div', 'dy-cal-grid');
      ['一', '二', '三', '四', '五', '六', '日'].forEach(function (w) {
        grid.appendChild(el('span', 'dy-cal-wk', w));
      });

      var first = new Date(m.y, m.m - 1, 1);
      var lead = (first.getDay() + 6) % 7;          /* 周一起排 */
      var dim = new Date(m.y, m.m, 0).getDate();
      var i;
      for (i = 0; i < lead; i++) grid.appendChild(el('span', 'dy-cal-d'));
      for (i = 1; i <= dim; i++) {
        var key = m.y + '-' + pad(m.m) + '-' + pad(i);
        var d = el('span', 'dy-cal-d' + (calCounts[key] ? ' has' : ''), String(i));
        if (calCounts[key]) {
          d.setAttribute('data-date', key);
          d.title = (m.y !== topYear ? m.y + '年 ' : '') + m.m + '月' + i + '日 · ' + calCounts[key] + ' 条';
        }
        grid.appendChild(d);
      }
      cal.appendChild(grid);
    }

    /* ---------- 目录跳转 v9.6：自绘缓动滚动 + 落地入场 ----------
       为什么不用 scrollIntoView({behavior:'smooth'})：
         同一次跳跃（点「二月」，8475px，1440×900，用 CDP screencast 抓**真呈现帧**
         再量 scrollY）：原生 smooth 落定 **1451ms**，而且节奏是"先甩后爬"——
         走过一半距离只用掉 **28%** 的时间，剩下一半靠 72% 的时间慢慢挪；
         本实现落定 **885ms**，半程落在 **51%** 的时间上，是一条对称的 S 曲线。
         ⚠️ 所以理由不是"原生太快"（它反而慢 64%），是**不可控 + 节奏错**：时长与
            曲线由引擎定，跨整屏时观感是被甩过去、后半程又拖。这里与站内
            script.js 的 smoothScrollTo 用**同一条** easeInOutCubic，时长按距离算
            （450~950ms）⇒ 手感与全站一致，曲线的尾巴长、落地不发飘。
         ⚠️ 起手先 `__wheelPause()`：那个引擎的 rAF lerp 也在写 scrollY，
            不停掉就是两套滚动互相追（与站点抽屉关后滚顶前的处理同一招）。
         ⚠️ 用户一动滚轮/手指/方向键就**立刻交出控制权**（cancelJump）——
            程序化滚动再好看，也不该跟用户抢。 */
    var jumpRaf = null, jumping = false;
    /* silent：scrollToY 换段时调它，只收尾不补绘（那一刻正要开新的一段，补绘是白干）。 */
    function cancelJump(silent) {
      if (jumpRaf !== null) { cancelAnimationFrame(jumpRaf); jumpRaf = null; }
      if (jumping) {
        jumping = false;
        if (!silent) updateSpy();   /* 用户接管 / 被打断：月历得补上落点那一月 */
      }
    }
    function onUserScrollInput() { cancelJump(false); }
    function scrollToY(targetY, onLand) {
      cancelJump(true);                                   /* 上一段立即让位 */
      if (window.__wheelPause) window.__wheelPause();
      jumping = true;                                     /* 飞行中月历不重绘（见 swapCal） */
      var startY = window.scrollY || window.pageYOffset;
      var maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      targetY = Math.max(0, Math.min(maxY, targetY));
      var d = targetY - startY;
      if (Math.abs(d) < 1) { window.scrollTo(0, targetY); jumping = false; onLand(); return; }
      var duration = Math.min(950, Math.max(450, 320 + Math.abs(d) / 4.2));   /* ms */
      var t0 = performance.now();
      function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
      function frame(now) {
        var t = Math.min(1, (now - t0) / duration);
        window.scrollTo(0, startY + d * ease(t));
        if (t < 1) { jumpRaf = requestAnimationFrame(frame); }
        else { jumpRaf = null; jumping = false; onLand(); updateSpy(); }
      }
      jumpRaf = requestAnimationFrame(frame);
    }
    window.addEventListener('wheel', onUserScrollInput, { passive: true });
    window.addEventListener('touchstart', onUserScrollInput, { passive: true });
    window.addEventListener('keydown', onUserScrollInput);

    /* 落地入场：目标那一「天」= 日期头 + 紧随其后的条目（直到下一个日期头）。
       ⚠️ 条目是日期头的**兄弟**，不在它里面（render 时按文档序 append 到同一个
          fragment）—— 所以按 nextElementSibling 往后走，别去 querySelector。 */
    var arriveTimer = null, arriveNodes = [];
    function clearArrive() {
      if (arriveTimer) { clearTimeout(arriveTimer); arriveTimer = null; }
      arriveNodes.forEach(function (n) {
        n.style.animationDelay = '';
        n.classList.add('is-visible');   /* 先钉住终态，再摘动画 —— 否则摘的那一帧可能闪回 opacity:0 */
        n.classList.remove('dy-arrive');
      });
      arriveNodes = [];
    }
    function arriveGroup(h) {
      clearArrive();
      var group = [h], n = h.nextElementSibling;
      while (n && !n.classList.contains('dy-day')) {
        if (n.classList.contains('dy-item')) group.push(n);
        n = n.nextElementSibling;
      }
      group.forEach(function (x, i) {
        x.style.animationDelay = (i * 55) + 'ms';
        x.classList.add('dy-arrive');
      });
      arriveNodes = group;
      arriveTimer = setTimeout(clearArrive, (group.length - 1) * 55 + 520 + 80);
    }
    /* 跳到某个日期头：算好落点（扣掉 CSS 的 scroll-margin-top，别在 JS 里再抄一遍
       那个 88），滚过去，落地时才闪 + 入场 —— 原来闪是在点击瞬间就放，滚到的时候
       半场已经结束了。 */
    function jumpToDay(h) {
      var mt = parseFloat(getComputedStyle(h).scrollMarginTop) || 0;
      var y = h.getBoundingClientRect().top + (window.scrollY || window.pageYOffset) - mt;
      scrollToY(y, function () { flashDay(h); arriveGroup(h); });
    }

    /* 索引点击：文字月份 → 跳到该月最早一天；日历有记日 → 跳到当天 */
    function flashDay(h) {
      var prev = document.querySelector('.dy-day.flash');
      if (prev) prev.classList.remove('flash');
      h.classList.add('flash');
      setTimeout(function () { h.classList.remove('flash'); }, 900);
    }
    document.addEventListener('click', function (e) {
      var row = e.target.closest ? e.target.closest('.dy-ml-row') : null;
      if (row) {
        var mk = row.getAttribute('data-mkey');
        setActiveMonth(mk);        /* 右栏立刻反应（目录高亮 + 月历换月），页面再滑过去 */
        var h = document.querySelector('.dy-day[id^="dy-d-' + mk + '"]');
        if (h) jumpToDay(h);
        return;
      }
      var d = e.target.closest ? e.target.closest('.dy-cal-d.has') : null;
      if (!d) return;
      var hd = document.getElementById('dy-d-' + d.getAttribute('data-date'));
      if (hd) jumpToDay(hd);
    });

    /* 目录高亮 + 单月历切换：滚动时标出当前所在月份 */
    function updateSpy() {
      var marks = document.querySelectorAll('.dy-day[id^="dy-d-"]');
      if (!marks.length) return;
      var cur = null;
      Array.prototype.forEach.call(marks, function (m) {
        if (m.getBoundingClientRect().top <= 190) cur = m;
      });
      if (!cur) cur = marks[0];
      setActiveMonth(cur.id.slice(5, 12));          /* 'dy-d-2026-08-30' → '2026-08' */
    }
    var spyPending = false;
    function onScrollSpy() {
      if (spyPending) return;
      spyPending = true;
      requestAnimationFrame(function () {
        updateSpy();
        spyPending = false;
      });
    }
    document.addEventListener('scroll', onScrollSpy, { passive: true });

    /* ---------- 长文折叠：展开 ↔ 收起 双向切换（v9.7） ---------- */
    function setupCollapse() {
      var maxLines = window.innerWidth <= 600 ? 4 : 6;
      var lh = parseFloat(getComputedStyle(document.documentElement).fontSize) * 1.9;
      var max = lh * maxLines + 4;
      Array.prototype.forEach.call(document.querySelectorAll('.dy-text'), function (t) {
        if (t.dataset.done) return;
        t.dataset.done = '1';
        var need = t.scrollHeight > max;
        var userExpanded = t.dataset.expanded === '1';
        if (!need && !userExpanded) return;

        /* 需要折叠 or 用户已手动展开 → 都挂按钮（当前状态决定文案） */
        if (need && !userExpanded) t.classList.add('collapsed');
        var btn = el('button', 'dy-expand', t.classList.contains('collapsed') ? '展开全文' : '收起');
        btn.type = 'button';
        btn.setAttribute('aria-expanded', t.classList.contains('collapsed') ? 'false' : 'true');
        t.parentNode.insertBefore(btn, t.nextSibling);
        btn.addEventListener('click', function () {
          var nowCollapsed = t.classList.toggle('collapsed');
          t.dataset.expanded = nowCollapsed ? '' : '1';
          btn.textContent = nowCollapsed ? '展开全文' : '收起';
          btn.setAttribute('aria-expanded', nowCollapsed ? 'false' : 'true');
        });
      });
    }

    /* ---------- 灯箱：共享引擎（assets/js/lightbox.js）----------
       引擎（换图 / 出-进淡滑 / 拖动跟手 / 圆点 / 触控板手势 / 环形 / 手机横屏）
       全在共享文件里，本页只留一句话：**点哪一格就开哪一格显示的那张**。

       v11.6（2026-09-14，主人「点击+3显示图片错误，显示的不是对应图片」）：
       这里原来对「+N 更多」格做 `idx += 1`（跳到"第一张没在网格里露出的照片"，
       照朋友圈习惯），于是格子里明明显示的是第 9 张（09-bookshelf-cat），点开却是
       第 10 张（10-game-event）—— 看得见的那张跟点开的那张对不上。
       规则改成一句话：**点哪一格就打开那一格【里显示的那张】**，
       没露出来的往右滑即可看到（圆点数本来就是全部张数）。

       ⚠️ 为什么挂在 DOMContentLoaded 上：引擎是 defer 的，本页这段内联脚本不是 ——
          内联脚本执行时 window.RMLightbox 还不存在。defer 脚本全部跑完才轮到
          DOMContentLoaded，在这里绑才拿得到引擎
          （顺序反了会静默绑不上：点图一点反应都没有，控制台也不报错）。 */
    document.addEventListener('DOMContentLoaded', function () {
      if (!window.RMLightbox) return;
      document.addEventListener('click', function (e) {
        var img = e.target.closest ? e.target.closest('.dy-img') : null;
        if (!img) return;
        var item = img.closest ? img.closest('.dy-item') : null;
        var list = (item && item._dyPhotos) || [];
        if (!list.length) return;
        var idx = parseInt(img.dataset.idx || '0', 10);
        if (isNaN(idx)) idx = 0;
        window.RMLightbox.open(list, idx);
      });
    });

    /* ---------- 入场 stagger（只服务老引擎）----------
       2026-09-16：进出场已改成 CSS 滚动驱动（见页内「滚动驱动进出场」注释块）。
       支持 animation-timeline: view() 的引擎里**不该**再跑这套 —— 两边同时写
       opacity 会打架（IO 的 .is-visible 是普通声明，动画会赢，等于白跑一趟还多挂
       24 个 observer）。所以这里第一件事就是探测并让路，只在没有 view() 时兜底。 */
    function supportsViewTimeline() {
      return !!(window.CSS && CSS.supports &&
                CSS.supports('animation-timeline', 'view()'));
    }
    function initEntrance() {
      if (supportsViewTimeline()) return;
      var els = Array.prototype.slice.call(document.querySelectorAll('.dy-item, .dy-day'));
      if (!('IntersectionObserver' in window)) {
        els.forEach(function (x) { x.classList.add('is-visible'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.filter(function (e) { return e.isIntersecting; })
          .sort(function (a, b) {
            return (a.target.compareDocumentPosition(b.target) & 4) ? -1 : 1;
          })
          .forEach(function (e, i) {
            e.target.style.transitionDelay = (i * 70) + 'ms';
            e.target.classList.add('is-visible');
            io.unobserve(e.target);
          });
      }, { threshold: 0.12, rootMargin: '0px 0px -50px 0px' });
      els.forEach(function (x) { io.observe(x); });
    }

    /* ---------- 启动 ----------
       v11：同步优先。数据随文档解析到位时直接渲染 —— 首帧就是完整内容流，
       跨文档过渡的新页快照因此带的是整页（不再是「页头 + 空白」）。 */
    function start(posts) {
      render(posts);
      setupCollapse();
      updateSpy();
      /* 老引擎的条目渐入等 page-ready：站内导航时 loader.js 会把 .page-ready 推迟到
         「新页快照拍完之后」（见 loader.js 的 navGate），这样
         ① 拍摄时条目处于终态（snapshot 完整、不白闪），
         ② 幕布撤掉时它们才带着 stagger 渐入 —— 与首页 hero 的入场同一时刻起跑。
         首访时 page-ready 早就绪，等价于「立刻 initEntrance」，行为不变。
         ⚠️ 支持 view() 时 initEntrance 会自己让路（见上），这里的 page-ready 等待
            就只是白等一次 —— 滚动驱动不依赖它，首帧的透明度直接由滚动位置决定。 */
      if (document.documentElement.classList.contains('page-ready')) initEntrance();
      else document.addEventListener('pageReady', initEntrance, { once: true });
    }
    function bootFail(err) {
      console.error('[posts] 加载失败：', err,
        '\n  数据源 =', DY_DATA,
        '\n  协议   =', location.protocol);
      var empty = document.getElementById('dyEmpty');
      if (empty) empty.hidden = false;
    }
    var bootPosts = postsFromGlobal();
    if (bootPosts) { start(bootPosts); }
    else { loadPosts().then(start).catch(bootFail); }

    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () {
        Array.prototype.forEach.call(document.querySelectorAll('.dy-text[data-done]'), function (t) {
          delete t.dataset.done;
          /* 只回退到“默认折叠态”：手动展开过的（data-expanded=1）保留展开 */
          if (t.dataset.expanded !== '1') t.classList.remove('collapsed');
          var n = t.nextElementSibling;
          if (n && n.classList.contains('dy-expand')) n.remove();
        });
        setupCollapse();
      }, 180);
    });
  })();
  </script>
</body>
</html>
