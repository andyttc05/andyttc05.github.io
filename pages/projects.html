  <!-- 全屏加载页（第一百四十七批 2026-08-22 主人"不喜欢品牌猫 favicon 的加载页，参考
       https://github.com/bistutzyy/taozhiyy"）：taozhiyy 同款 three-body loader ——
       三个圆点轨道摆动 + 整体旋转的纯 CSS 动态图形（无文字无进度条无品牌图标）。
       样式：assets/css/loader.css；逻辑：assets/js/loader.js（第一百五十五批 2026-08-23
       渐进式加载：不再等图片，window load + 字体就绪即放行 —— 图片不阻塞首屏渲染；
       其余决策保持：bfcache 跳过、秒开不闪、首访最短展示、慢网放宽、兜底上限不锁页面；
       就绪同时给 <html> 加 .page-ready 并派发 pageReady 事件，
       script.js 的 hero 入场 / 打字机 / about 标题弹出都靠它才播）。
       noscript 兜底：JS 禁用时直接隐藏加载页，页面内容照常可见。 -->
  <div id="pageLoader" role="status" aria-label="页面加载中">
    <div class="page-loader-three" aria-hidden="true">
      <div class="page-loader-dot"></div>
      <div class="page-loader-dot"></div>
      <div class="page-loader-dot"></div>
    </div>
  </div>
  <noscript><style>#pageLoader{display:none}</style></noscript>
  <script>
    /* 第一百四十五批兜底：loader.js 未加载/异常时（defer 脚本被屏蔽、CDN 404 等），
       load+2s 后强制解除加载页 —— 页面绝不因加载页而不可见。
       正常路径 loader.js 已先完成，此段检查 .page-ready 幂等跳过。 */
    window.addEventListener('load', function () {
      setTimeout(function () {
        var loader = document.getElementById('pageLoader');
        var html = document.documentElement;
        if (!loader || html.classList.contains('page-ready')) return;
        html.classList.remove('page-loading');
        html.classList.add('page-ready');
        try { document.dispatchEvent(new CustomEvent('pageReady')); } catch (e) {}
        loader.classList.add('is-done');
        setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
      }, 2000);
    });
  </script>
