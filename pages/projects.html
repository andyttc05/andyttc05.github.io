  <script>
    /* 第一百四十五批兜底：loader.js 未加载/异常时（defer 脚本被屏蔽、CDN 404 等），
       load+2s 后强制解除加载页 —— 页面绝不因加载页而不可见。
       正常路径 loader.js 已先完成，此段检查 .page-ready 幂等跳过。 */
    window.addEventListener('load', function () {
      setTimeout(function () {
        var loader = document.getElementById('pageLoader');
        var html = document.documentElement;
        if (!loader || html.classList.contains('page-ready')) return;
        html.classList.remove('page-loading');
        html.classList.add('page-ready');
        try { document.dispatchEvent(new CustomEvent('pageReady')); } catch (e) {}
        loader.classList.add('is-done');
        setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
      }, 2000);
    });
  </script>
