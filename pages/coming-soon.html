<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建设中 — rain.meow</title>
<link rel="preload" as="font" type="font/woff2" crossorigin href="../assets/fonts/ibm-plex-serif-400-normal.latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="../assets/fonts/ibm-plex-mono-400-normal.latin.woff2">
<!-- 本地自托管字体（第一百四十八批 2026-08-22 主人"字体一并接入"）：
     替换 Google Fonts CDN —— woff2 本地化，latin/latin-ext 子集分段加载，
     中文走系统字体回退（与原行为一致）；@font-face 声明见 ../assets/css/fonts.css -->
<link rel="stylesheet" href="../assets/css/fonts.css?v=1">
<link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
<!-- 全屏加载页样式（第一百四十六批 2026-08-22 主人"加载界面简洁一点"）：
     独立于 style.css（本页不引 style.css 也要用），三个页面共用 -->
<link rel="stylesheet" href="../assets/css/loader.css?v=3">
<style>
  :root {
    --color-ink: #0f172a;
    --color-paper: #f8fafc;
    --color-accent: #2563eb;
    --color-accent-rgb: 37, 99, 235;
    --color-rule: #cbd5e1;
    --color-muted: #475569;
    --color-alt: #f1f5f9;
  }
  /* 加载页关键定位（第一百四十五批）：首帧即全屏覆盖（loader.css 的完整视觉就位前兜底） */
  #pageLoader {
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    background: var(--color-paper, #f8fafc);
    color: var(--color-ink, #0f172a);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 背景色只放 html（画布层），body 透明——否则不透明 body 背景会盖住全屏背景 canvas */
  html {
    height: 100%;
    background: var(--color-paper);
    color: var(--color-ink);
    font-family: 'IBM Plex Serif', 'Plex Serif FB', serif;
  }
  body {
    height: 100%;
    background: transparent;
    color: var(--color-ink);
    font-family: 'IBM Plex Serif', 'Plex Serif FB', serif;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }

  .wrapper {
    text-align: center;
    max-width: 640px;
  }

  .typewriter {
    font-family: 'IBM Plex Mono', 'Plex Mono FB', monospace;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 400;
    color: var(--color-ink);
    letter-spacing: 0.5px;
    min-height: 1.6em;
    line-height: 1.6;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: var(--color-accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s steps(1) infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .back-link {
    margin-top: 56px;
    font-family: 'IBM Plex Mono', 'Plex Mono FB', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
  }
  .back-link a {
    color: var(--color-muted);
    text-decoration: none;
    border-bottom: 1px solid var(--color-rule);
    padding-bottom: 2px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .back-link a:hover {
    color: var(--color-accent);
    border-color: var(--color-accent);
  }
</style>
</head>
<body>
<!-- 全屏加载页（第一百四十七批 2026-08-22 主人"不喜欢品牌猫 favicon 的加载页，参考
     https://github.com/bistutzyy/taozhiyy"）：taozhiyy 同款 three-body loader ——
     三个圆点轨道摆动 + 整体旋转的纯 CSS 动态图形（无文字无进度条无品牌图标）。
     样式：assets/css/loader.css；逻辑：assets/js/loader.js（基于时间/场景/用户感知的决策系统：
     bfcache 跳过、秒开不闪、首访最短展示、慢网放宽、兜底上限不锁页面；
     就绪同时给 <html> 加 .page-ready 并派发 pageReady 事件，本页打字机等它才开打）。
     noscript 兜底：JS 禁用时直接隐藏加载页，页面内容照常可见。 -->
<div id="pageLoader" role="status" aria-label="页面加载中">
  <div class="page-loader-three" aria-hidden="true">
    <div class="page-loader-dot"></div>
    <div class="page-loader-dot"></div>
    <div class="page-loader-dot"></div>
  </div>
</div>
<noscript><style>#pageLoader{display:none}</style></noscript>
<script>
  /* 第一百四十五批兜底：loader.js 未加载/异常时，load+2s 后强制解除加载页。
     正常路径 loader.js 已先完成，此段检查 .page-ready 幂等跳过。 */
  window.addEventListener('load', function () {
    setTimeout(function () {
      var loader = document.getElementById('pageLoader');
      var html = document.documentElement;
      if (!loader || html.classList.contains('page-ready')) return;
      html.classList.remove('page-loading');
      html.classList.add('page-ready');
      try { document.dispatchEvent(new CustomEvent('pageReady')); } catch (e) {}
      loader.classList.add('is-done');
      setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
    }, 2000);
  });
</script>
<div class="wrapper">
  <p class="typewriter"><span id="typewriter-text"></span><span class="cursor"></span></p>
  <p class="back-link"><a href="../index.html">&larr; 返回主页</a></p>
</div>
<script>
(function() {
  var el = document.getElementById('typewriter-text');
  var texts = [
    '页面正在建设中\u2026',
    'Something wonderful is coming.',
    'Stay tuned.',
    '\u6bcf\u4e00\u4e2a\u50cf\u7d20\u90fd\u5728\u7cbe\u5fc3\u6253\u78e8\u3002'
  ];
  var textIdx = 0;
  var charIdx = 0;
  var isDeleting = false;
  var typingSpeed = 80;
  var deletingSpeed = 40;
  var pauseAfterType = 2500;
  var pauseAfterDelete = 400;

  function tick() {
    var currentText = texts[textIdx];

    if (!isDeleting) {
      charIdx++;
      el.textContent = currentText.substring(0, charIdx);

      if (charIdx === currentText.length) {
        isDeleting = true;
        setTimeout(tick, pauseAfterType);
        return;
      }
      setTimeout(tick, typingSpeed);
    } else {
      charIdx--;
      el.textContent = currentText.substring(0, charIdx);

      if (charIdx === 0) {
        isDeleting = false;
        textIdx = (textIdx + 1) % texts.length;
        setTimeout(tick, pauseAfterDelete);
        return;
      }
      setTimeout(tick, deletingSpeed);
    }
  }

  /* 第一百四十五批（加载页）：打字机等页面就绪（loader.js 派发 pageReady）再开打，
     加载页淡出后才开始打字，避免内容在加载页背后空转 */
  function bootTypewriter() { setTimeout(tick, 600); }
  if (document.documentElement.classList.contains('page-ready')) {
    bootTypewriter();
  } else {
    document.addEventListener('pageReady', bootTypewriter, { once: true });
    window.addEventListener('load', function () {
      setTimeout(bootTypewriter, 1000);
    }, { once: true });
  }
})();
</script>
<!-- 全屏加载页控制器（第一百四十六批）：基于时间/场景/用户感知的决策系统，就绪后派发 pageReady -->
<script src="../assets/js/loader.js?v=3" defer></script>
<!-- 全屏背景动效（与主页同款）：几何粒子网络 + 动态几何飘带，单色 accent 版 -->
<script id="canvas_nest" defer="defer" opacity="0.6" zIndex="-1" count="99" mobile="true" src="../assets/js/canvas-nest.js?v=3"></script>
<script id="fluttering_ribbon" defer="defer" src="../assets/js/canvas-ribbons.js?v=3"></script>
</body>
</html>
