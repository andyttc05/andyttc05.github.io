<!-- 导航观感三件套（2026-09-13 主人"参考 tblog.mmzhiku.xyz，优化加载体验与闪烁"）
     ② 站内导航判据：从站内某页点进来（referrer 同源，或用会话标记 rm-visited
        兜底）时给 <html> 加 .nav-instant，
        全屏加载页连第一帧都不画（display:none 见 ../assets/css/loader.css），
        加载页只留给会话的第一次进入做品牌落地；
     ③ speculationrules：悬停站内链接即预取下一页，点击时文档已在 HTTP 缓存里。
     （本页无深色主题，① 的防白闪底色只写 light 一条，见 <title> 之后那段。三者都是渐进增强。） -->
<script>
  (function () {
    var de = document.documentElement;
    var internal = false;
    /* ① 主判据 referrer 同源 = 从站内某页点进来。不依赖任何存储、同步可读 ——
       实测 sessionStorage 在本页 head 里偶发取不到（12 次里 2 次抛错），
       所以存储只当兜底，不当主判据。 */
    try {
      if (document.referrer) {
        var a = document.createElement('a');
        a.href = document.referrer;
        internal = a.origin === location.origin;
      }
    } catch (e) {}
    /* ② 本次会话已经看过至少一页：referrer 被策略剥掉（外部 no-referrer 等）时兜底 */
    try {
      if (sessionStorage.getItem('rm-visited') === '1') internal = true;
      else if (!document.prerendering) sessionStorage.setItem('rm-visited', '1');
    } catch (e) {}
    if (internal) de.classList.add('nav-instant');
  })();
</script>
<script type="speculationrules">
{"prefetch":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}
</script>

<!-- 全屏加载页（第一百四十七批 2026-08-22 主人"不喜欢品牌猫 favicon 的加载页，参考
     https://github.com/bistutzyy/taozhiyy"）：taozhiyy 同款 three-body loader ——
     三个圆点轨道摆动 + 整体旋转的纯 CSS 动态图形（无文字无进度条无品牌图标）。
     样式：assets/css/loader.css；逻辑：assets/js/loader.js（第一百五十五批 2026-08-23
     渐进式加载：不再等图片，window load + 字体就绪即放行 —— 图片不阻塞首屏渲染；
     其余决策保持：bfcache 跳过、秒开不闪、首访最短展示、慢网放宽、兜底上限不锁页面；
     就绪同时给 <html> 加 .page-ready 并派发 pageReady 事件，本页打字机等它才开打）。
     noscript 兜底：JS 禁用时直接隐藏加载页，页面内容照常可见。 -->
<!-- ⚠️ 加载幕布是设计特色，别删：只在本次会话第一次进入时露脸（站内点击 / 刷新都不画）。
     守卫见 tools/stamp.mjs 的 CURTAIN 那条 + README「加载幕布」一节。 -->
<div id="pageLoader" role="status" aria-label="页面加载中">
  <div class="page-loader-three" aria-hidden="true">
    <div class="page-loader-dot"></div>
    <div class="page-loader-dot"></div>
    <div class="page-loader-dot"></div>
  </div>
</div>
<noscript><style>#pageLoader{display:none}</style></noscript>
<script>
  /* 第一百四十五批兜底：loader.js 未加载/异常时，load+2s 后强制解除加载页。
     正常路径 loader.js 已先完成，此段检查 .page-ready 幂等跳过。 */
  window.addEventListener('load', function () {
    setTimeout(function () {
      var loader = document.getElementById('pageLoader');
      var html = document.documentElement;
      if (!loader || html.classList.contains('page-ready')) return;
      html.classList.remove('page-loading');
      html.classList.add('page-ready');
      try { document.dispatchEvent(new CustomEvent('pageReady')); } catch (e) {}
      loader.classList.add('is-done');
      setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
    }, 2000);
  });
</script>
<div class="wrapper">
  <p class="typewriter"><span id="typewriter-text"></span><span class="cursor"></span></p>

</div>
<script>
(function() {
  var el = document.getElementById('typewriter-text');
  /* 四句统一以三个点收尾（2026-09-16 主人"句子结尾使用...比较好"）：
     原来是 … / . / . / 。 四种结尾混着，第 1 句还是单字符省略号 …（一个字宽）。
     统一成 "..." 后：结尾节奏一致，且打字机逐字打出三个点比直接跳出一个 … 更像在打。 */
  var texts = [
    '页面正在建设中...',
    'Something wonderful is coming...',
    'Stay tuned...',
    '\u6bcf\u4e00\u4e2a\u50cf\u7d20\u90fd\u5728\u7cbe\u5fc3\u6253\u78e8...'
  ];
  var textIdx = 0;
  var charIdx = 0;
  var isDeleting = false;
  var typingSpeed = 80;
  var deletingSpeed = 40;
  /* 间隔（2026-09-16 主人"两秒比较好" → 看真机后又定 2.5s）：整句打完后停 2500ms
     再开始回删，回删完停 400ms 立刻接下一句 —— 两句之间的空档约 2.5s + 回删耗时。 */
  var pauseAfterType = 2500;
  var pauseAfterDelete = 400;

  function tick() {
    var currentText = texts[textIdx];

    if (!isDeleting) {
      charIdx++;
      el.textContent = currentText.substring(0, charIdx);

      if (charIdx === currentText.length) {
        isDeleting = true;
        setTimeout(tick, pauseAfterType);
        return;
      }
      setTimeout(tick, typingSpeed);
    } else {
      charIdx--;
      el.textContent = currentText.substring(0, charIdx);

      if (charIdx === 0) {
        isDeleting = false;
        textIdx = (textIdx + 1) % texts.length;
        setTimeout(tick, pauseAfterDelete);
        return;
      }
      setTimeout(tick, deletingSpeed);
    }
  }

  /* 第一百四十五批（加载页）：打字机等页面就绪（loader.js 派发 pageReady）再开打，
     加载页淡出后才开始打字，避免内容在加载页背后空转 */
  /* ⚠️ 只能开打一次（2026-09-16）。原来 pageReady 与 load+1s 两条路**都会**调
     bootTypewriter ⇒ 两条 tick 链同时写同一个元素：A 在 2s 停留里不动，B 还在打字，
     用户看到的就是"句子之间没有停留"（实测 24s 内 319 次文本变化、≥900ms 的空档 0 次）。
     现在用 booted 闸门：谁先到谁开打，另一条直接返回。 */
  var booted = false;
  function bootTypewriter() {
    if (booted) return;
    booted = true;
    setTimeout(tick, 600);
  }
  if (document.documentElement.classList.contains('page-ready')) {
    bootTypewriter();
  } else {
    document.addEventListener('pageReady', bootTypewriter, { once: true });
    window.addEventListener('load', function () {
      setTimeout(bootTypewriter, 1000);
    }, { once: true });
  }
})();
</script>
