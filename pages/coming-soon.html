<!-- 导航观感三件套（2026-09-13 主人"参考 tblog.mmzhiku.xyz，优化加载体验与闪烁"）
     ② 站内导航判据：从站内某页点进来（referrer 同源，或用会话标记 rm-visited
        兜底）时给 <html> 加 .nav-instant，
        全屏加载页连第一帧都不画（display:none 见 ../assets/css/loader.css），
        加载页只留给会话的第一次进入做品牌落地；
     ③ speculationrules：悬停站内链接即预取下一页，点击时文档已在 HTTP 缓存里。
     （本页无深色主题，① 的防白闪底色只写 light 一条，见 <title> 之后那段。三者都是渐进增强。） -->
<script>
  (function () {
    var de = document.documentElement;
    var internal = false;
    /* ① 主判据 referrer 同源 = 从站内某页点进来。不依赖任何存储、同步可读 ——
       实测 sessionStorage 在本页 head 里偶发取不到（12 次里 2 次抛错），
       所以存储只当兜底，不当主判据。 */
    try {
      if (document.referrer) {
        var a = document.createElement('a');
        a.href = document.referrer;
        internal = a.origin === location.origin;
      }
    } catch (e) {}
    /* ② 本次会话已经看过至少一页：referrer 被策略剥掉（外部 no-referrer 等）时兜底 */
    try {
      if (sessionStorage.getItem('rm-visited') === '1') internal = true;
      else if (!document.prerendering) sessionStorage.setItem('rm-visited', '1');
    } catch (e) {}
    /* ②b 存储兜底（2026-09-27）：上面 ② 在 Safari 会整段失效（sessionStorage 在本页 head 里
       偶发抛错，本仓实测 12 次里 2 次），而 ① 对"地址栏重新回车 / 无 referrer 的自站再进"
       也拿不到 —— 两条一起失效时，站内的一跳会被判成"外来首次访问"：加载页上来、入场重播
       （主人「刷新时任何情况都强制有个白色底的加载动画 / 还在闪」）。
       会话 Cookie 不跟着抛，且 Safari 封的是第三方 Cookie、第一方照常读写。
       不设 Max-Age ⇒ 会话级，语义与 ② 一致（加载页只留给"会话的第一次进入"做品牌落地）。
       ⚠️ 它比 sessionStorage 宽一档（同浏览器会话的**新标签页**也算"已看过"）—— 这是刻意的：
       加载页是"会话的第一次进入"的语汇，不是"每个标签页的第一次"。 */
    try {
      if (/(?:^|;\s*)rm-visited=1/.test(document.cookie)) internal = true;
      else if (!document.prerendering) document.cookie = 'rm-visited=1; path=/; SameSite=Lax';
    } catch (e) {}
    /* ③ 跨文档过渡会「拍快照」的那一跳才需要把入场载体钉在终态（快照得拍到完整页）。
       刷新**没有**过渡 ⇒ 钉了只会让首屏先画一帧完整页、下一帧又回退到入场初始态重播
       —— 主人 2026-09-27「主页刷新时闪了一下 / 好奇怪」。所以钉子改由 `.nav-vt` 控制，刷新不给。
       ⚠️ `.nav-instant` 本身不能省：loader.css 靠它连第一帧都不画加载页。 */
    var navType = '';
    try { var ne = performance.getEntriesByType('navigation')[0]; navType = ne ? ne.type : ''; } catch (e) {}
    /* 刷新一律按"站内"处理，不看 referrer / sessionStorage —— 刷新不可能是"外来首次访问"。
       严格隐私（referrer 被剥 + sessionStorage 不可用）下原先会判成外来 ⇒ 走冷加载那条路：
       入场重播（新页首帧是空页）+ 幕布可能上来把入场开头吃掉 ——
       主人 2026-09-27「还是 safari 有问题 / 主页刷新登场动画会被吞」。 */
    if (navType === 'reload') internal = true;
    if (internal) {
      de.classList.add('nav-instant');
      if (navType !== 'reload') de.classList.add('nav-vt');
      /* 刷新：不重播「到达」那套入场，只让巨字**逐字上浮**到位（见 style.css 的 .nav-reload 段）——
         首帧即终态、只有巨字偏低 10px 且 opacity 全程 1（任何东西的首帧都不许比终态暗）。
         hero 其余部分（文字 / 立绘 / CTA）自 2026-09-28 第十八轮起**首帧即终态**，
         所以这一跳唯一会动的就是标题，主页与墙页刷新时同一套观感。
         刷新没有跨文档过渡，新页首帧若从入场初始态起步，就是从「你正在看的完整页」
         切成一张空页再长回来 —— 主人 2026-09-27「页面刷新还是有闪烁」，实测空页
         100~170ms + 重建 ~600ms。入场是「到达」的语汇（冷加载 / 站内点击），刷新是
         「同一页再看一次」，不该重演组装。
         ⚠️ 只掐刷新这一条：`.nav-vt`（快照态）与冷加载那条路一个字不动。 */
      else de.classList.add('nav-reload');
    }
    /* ③ 跨文档过渡的「快照已拍」信号 —— **必须挂在 main 的 head 里**，不能留给 loader.js。
       loader.js 是 `defer`，而 pagereveal 有时比 defer 脚本还早到（2026-09-27 实测新文档
       +4~23ms 都有），事件先到就永远收不到 ⇒ 只好退回 setTimeout(open, 350) 兜底；那 350ms 里
       页面停在快照态（入场载体全被压在终态，看着「已经完工」），随后整体回退重播入场
       —— 观感就是主人说的「切换页面时开场动画会有点卡顿」。实测 HEAD 站内点击 20 跳里
       5 跳（25%）中招，且目标页越轻越容易中。所以由本块（在样式表之前、全站逐字节相同）
       先接住，loader.js 的 navGate 优先读 window.__rmNavVT。
       ⚠️ 值与 `open()` 的判据同源：null = 本次没起过渡（刷新/被跳过）⇒ 立即开闸。
       ⚠️ 本块受 tools/stamp.mjs 的 SNIPPET 检查（各页必须逐字节一致），改一处就要全站改。 */
    window.addEventListener('pagereveal', function (e) {
      window.__rmNavVT = (e && e.viewTransition) || null;
    });
  })();
</script>

/* 触屏按压反馈（2026-09-27）：本页按设计不引 script.js，所以自带一份 —— 与 script.js
   的「触屏按压反馈」段**逻辑一致**（那边注释里有完整的实测依据：触摸端 `:hover` 抬手后
   粘住、`<a>` 拿不到 `:active`，所以按下反馈只能靠 `.is-press`；抬手后留 180ms
   最小可见时长，跨文档过渡拍旧页快照正好在这段里）。改这里要连那边一起改。
   名单只有「← 返回主页」这一颗 —— 本页没有别的可点元素。 */
(function () {
  if (!window.matchMedia('(hover: none)').matches) return;
  var el = document.querySelector('.back-link a');
  if (!el) return;
  var MIN_MS = 180, SLOP = 8;
  var down = false, t0 = 0, timer = 0, sx = 0, sy = 0;
  function drop() { clearTimeout(timer); el.classList.remove('is-press'); down = false; }
  function release() {
    if (!down) return;
    down = false;
    var wait = Math.max(0, MIN_MS - (performance.now() - t0));
    clearTimeout(timer);
    timer = setTimeout(function () { el.classList.remove('is-press'); }, wait);
  }
  el.addEventListener('pointerdown', function (e) {
    clearTimeout(timer);
    down = true; t0 = performance.now(); sx = e.clientX; sy = e.clientY;
    el.classList.add('is-press');
  }, { passive: true });
  el.addEventListener('pointermove', function (e) {
    if (down && (Math.abs(e.clientX - sx) > SLOP || Math.abs(e.clientY - sy) > SLOP)) drop();
  }, { passive: true });
  el.addEventListener('pointerup', release, { passive: true });
  el.addEventListener('pointercancel', drop, { passive: true });
  window.addEventListener('blur', drop);
})();
</script>
<script>
(function() {
  var el = document.getElementById('typewriter-text');
  /* 四句统一以三个点收尾（2026-09-16 主人"句子结尾使用...比较好"）：
     原来是 … / . / . / 。 四种结尾混着，第 1 句还是单字符省略号 …（一个字宽）。
     统一成 "..." 后：结尾节奏一致，且打字机逐字打出三个点比直接跳出一个 … 更像在打。 */
  var texts = [
    '页面正在建设中...',
    'Something wonderful is coming...',
    'Stay tuned...',
    '\u6bcf\u4e00\u4e2a\u50cf\u7d20\u90fd\u5728\u7cbe\u5fc3\u6253\u78e8...'
  ];
  var textIdx = 0;
  var charIdx = 0;
  var isDeleting = false;
  var typingSpeed = 80;
  var deletingSpeed = 40;
  /* 间隔（2026-09-16 主人"两秒比较好" → 看真机后又定 2.5s）：整句打完后停 2500ms
     再开始回删，回删完停 400ms 立刻接下一句 —— 两句之间的空档约 2.5s + 回删耗时。 */
  var pauseAfterType = 2500;
  var pauseAfterDelete = 400;

  function tick() {
    var currentText = texts[textIdx];

    if (!isDeleting) {
      charIdx++;
      el.textContent = currentText.substring(0, charIdx);

      if (charIdx === currentText.length) {
        isDeleting = true;
        setTimeout(tick, pauseAfterType);
        return;
      }
      setTimeout(tick, typingSpeed);
    } else {
      charIdx--;
      el.textContent = currentText.substring(0, charIdx);

      if (charIdx === 0) {
        isDeleting = false;
        textIdx = (textIdx + 1) % texts.length;
        setTimeout(tick, pauseAfterDelete);
        return;
      }
      setTimeout(tick, deletingSpeed);
    }
  }

  /* 第一百四十五批（加载页）：打字机等页面就绪（loader.js 派发 pageReady）再开打，
     加载页淡出后才开始打字，避免内容在加载页背后空转 */
  /* ⚠️ 只能开打一次（2026-09-16）。原来 pageReady 与 load+1s 两条路**都会**调
     bootTypewriter ⇒ 两条 tick 链同时写同一个元素：A 在 2s 停留里不动，B 还在打字，
     用户看到的就是"句子之间没有停留"（实测 24s 内 319 次文本变化、≥900ms 的空档 0 次）。
     现在用 booted 闸门：谁先到谁开打，另一条直接返回。 */
  var booted = false;
  function bootTypewriter() {
    if (booted) return;
    booted = true;
    setTimeout(tick, 600);
  }
  if (document.documentElement.classList.contains('page-ready')) {
    bootTypewriter();
  } else {
    document.addEventListener('pageReady', bootTypewriter, { once: true });
    window.addEventListener('load', function () {
      setTimeout(bootTypewriter, 1000);
    }, { once: true });
  }
})();
</script>
