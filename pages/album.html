<!-- === 本页是「单册页模板」（2026-09-25 方案 B 静态化）===
     19 个单册页由 tools/photos-data.py 从**本文件**派生（同一份骨架 ⇒ 启动片段天然逐字节相同，
     stamp.mjs 的 SNIPPET 检查覆盖得住），写进 pages/albums/<slug>.html。
     本文件自己只剩一个职责：**老网址的路由器** —— `album.html?slug=xxx` 这条链接
     在改版前是真的，不能让它 404（GitHub Pages 没有服务端跳转）。
     标记（生成器只认这一种写法，改格式要同步 tools/photos-data.py）：
       开口标记 = 注释起始符 + `RM-BEGIN` + 名字，收口标记同形写 `RM-END`。
       下面这段说明本身刻意不写出完整的注释标记 —— HTML 注释不能嵌套，
       写全了会把本段提前收口，剩下的字会掉进文档里当正文。
     生成器只换两者**之间**的内容，标记本身留着 ⇒ 可以反复重跑（幂等）。 -->

<!--RM-BEGIN headmeta-->

<!-- 导航观感三件套（2026-09-13 主人"参考 tblog.mmzhiku.xyz，优化加载体验与闪烁"）
     ① html 底色内联在 head：style.css 到达前也不会白闪（深色用户不再先白一下）；
        ⚠️ 2026-09-26：亮色串 #ffffff → #f5f5f7。它必须等于 style.css 的 `--color-canvas`
        （画布），**不是** --color-paper —— 两边不同值就会先闪一下 10 级的白。
     ② 站内导航判据：从站内某页点进来（referrer 同源，或用会话标记 rm-visited
        兜底）时给 <html> 加 .nav-instant，
        全屏加载页连第一帧都不画（display:none 见 ../assets/css/loader.css），
        加载页只留给会话的第一次进入做品牌落地；
     ③ speculationrules：悬停站内链接即预取下一页，点击时文档已在 HTTP 缓存里。
     三者都是渐进增强 —— 不支持的浏览器原样走老行为。 -->
<style>
  html { background: #f5f5f7; }
  html.theme-dark { background: #131a26; }
</style>
<script>
  (function () {
    var de = document.documentElement;
    var internal = false;
    /* ① 主判据 referrer 同源 = 从站内某页点进来。不依赖任何存储、同步可读 ——
       实测 sessionStorage 在本页 head 里偶发取不到（12 次里 2 次抛错），
       所以存储只当兜底，不当主判据。 */
    try {
      if (document.referrer) {
        var a = document.createElement('a');
        a.href = document.referrer;
        internal = a.origin === location.origin;
      }
    } catch (e) {}
    /* ② 本次会话已经看过至少一页：referrer 被策略剥掉（外部 no-referrer 等）时兜底 */
    try {
      if (sessionStorage.getItem('rm-visited') === '1') internal = true;
      else if (!document.prerendering) sessionStorage.setItem('rm-visited', '1');
    } catch (e) {}
    if (internal) de.classList.add('nav-instant');
  })();
</script>
<!--RM-BEGIN router-->
<!-- 老网址兜底（2026-09-25 方案 B 静态化）：单册页从「一个文件 + ?slug=」改成
     19 个静态页（pages/albums/<slug>.html）之后，`album.html?slug=xxx` 这条旧链接
     还活在人家的书签与浏览记录里，不能 404。解析期（body 之前）就跳走，
     连一帧空白页都不留给用户。location.replace ⇒ 不在历史里多留一条，返回键照旧。
     ⚠️ 生成器会把这一整段（含本注释）从 19 个静态页里删掉 —— 它们不需要路由器。 -->
<script>
  (function () {
    var m = /[?&]slug=([^&]+)/.exec(location.search);
    var to = m ? 'albums/' + encodeURIComponent(decodeURIComponent(m[1])) + '.html' : 'photos.html';
    location.replace(to + location.hash);
  })();
</script>
<!--RM-END router-->

{"prefetch":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}

<!-- === 首绘渲染闸（2026-09-25 第二轮）：把「第一次渲染机会」按住，直到对齐行真的排好 ===
     为什么非要有它：几何是 JS 在解析期算的，而浏览器拍跨文档快照的时机 =
     "样式表就绪后的第一个渲染机会" —— 两者在**赛跑**，而且不是稳赢。
     实测同一份页面同一台机器（限速 100ms/500KB/s，跑 6 次）：解析器恢复的时刻在
     3709~3753ms 之间飘，快照却稳定落在样式表就绪后 ~5ms ⇒ 有时赢、有时输；
     **输的那次快照里是没排版的散按钮**（52 张挤成小格子），过渡结束后才重排成
     对齐行 —— 这正是主人看到的"闪一下"。光把引擎往前挪治不了（见下面几何引擎那段）。
     闸的判据 = `#rmRows`：几何引擎排出来的第一行，id 由照片墙后面那段调用挂上。
     渲染机会因此必然晚于"对齐行就位" ⇒ 快照里就是最终排版。
     加上它之后实测：52 张的册、6 张的册各 5 次，rowsAtPr 全是最终值（5/5 + 5/5）。
     取证：~/.workbuddy/scratch/album-static-b-2026-09-25/probe-order.js
     ⚠️ 自救这件事**已经量过**，别照抄"必须靠定时器"：把引擎的调用换成 `throw`
        （行永远排不出来）再跑 3 次，pagereveal 落在"样式表就绪 +3.4~6ms"——
        闸自己会松开（解析结束时释放），页面照常渲染，只是退回没排版那副样子。
        所以下面那段定时器**不是**主保障，只是多一层网：万一将来的浏览器改了释放时机，
        它还能把渲染放出来。别删，也别把它当"主因"去理解。
     🔴 **位置是量出来的，别"顺手"挪**：闸与保命脚本都必须待在 head **末尾**
        （= 四张样式表之后）。实测三种摆法：
          · 闸 + 保命都放 </head> 之前（= 现在这样）→ 5/5 命中 ✓
          · 闸放 </head> 之前、保命留在样式表之前      → 0/5（闸被无视）
          · 两段都放样式表之前                        → 0/5（闸被无视）
        后两种的差别只在"保命脚本会不会卡在 head 里等样式表" —— 也就是说，闸要生效，
        解析器**必须被那段保命脚本按在 head 里**等样式表。结论反直觉但可复现，
        同一份文件在同一天换了端口重测也一样，所以照抄这个摆法。
     ⚠️ 代价（已量、已知）：解析器改在 head 里等样式表 ⇒ body（含照片墙的 <img>）
        要等样式表就绪才开始解析。**样式表走缓存时无代价**（常态）；冷缓存首访会晚
        一个 CSS 往返。取舍理由：冷缓存首访本来一切都冷，而"快照里排版错位"
        是每次进册页都发生的事。
     ⚠️ 不支持的浏览器直接忽略这枚链接 ⇒ 退回原来的赛跑，不会更糟。 -->
<link rel="expect" id="rmExpect" href="#rmRows" blocking="render">
<script>
  /* 第二层网（1s）：解析结束本来就会释放闸（已实测），正常路径下 #rmRows 也早就存在 ——
     这里什么都不做。留着是防"将来的浏览器改了释放时机"这种远期风险。
     ⚠️ 这段**必须是样式表之后的经典内联脚本**（会卡住解析器）：它不是可有可无的
        定时器 —— "解析器被按在 head 里等样式表"正是闸生效的前提（见上面那条实测）。 */
  setTimeout(function () {
    var l = document.getElementById('rmExpect');
    if (l && !document.getElementById('rmRows') && l.parentNode) l.parentNode.removeChild(l);
  }, 1000);
</script>

         上一册下一册 / 每一张照片，都由 tools/photos-data.py 在生成时写进 HTML。
         起因是跨文档过渡那一下整页闪白：新页快照（pagereveal，实测 52~270ms）拍在
         defer 的 photos.js 跑到之前（DCL 258~414ms）⇒ 快照里是一张空壳。
         现在文档首绘就带内容，图片也从解析期开始下。

         照片墙仍是「对齐行」：行等高、每张按真实长宽比定宽、行宽铺满容器。
         比 CSS grid 好在横竖混排时能看到每张的真实比例，比 CSS columns 好在
         顺序是从左到右的（相簿要按时间读）。
         ⚠️ 几何**仍在 JS 里算**（assets/js/album-strip.js 的 rows2layout()）——

             （见 ~/.workbuddy/scratch/album-static-b-2026-09-25/strip-compare.mjs）。
             所以那个引擎是**内联**的（解析期、零网络），钉在照片墙正后方，
             见下面那一段。 -->

    <div class="album-strip" id="albumStrip" aria-label="照片墙"><!--RM-BEGIN strip--><!--RM-END strip--></div>

    <!-- === 几何引擎：紧跟照片墙，定义完**就地调用**（2026-09-25 第二轮）===
         为什么钉在这个位置：解析器撞上 body 里第一段内联经典脚本时会停下来等 head
         的样式表（规范如此：解析器插入的脚本要等加载中的样式表），样式表就绪才恢复。
         引擎越早跑完越好，所以它排在照片墙正后方 —— body 里第一段内联脚本的位置。
         实测（限速 100ms / 500KB/s，直接进册页，5 次）：
           · 留在原处（plate.js 之后，中间隔 ~90 行）→ 引擎晚快照 20~50ms  ✗
         取证：~/.workbuddy/scratch/album-static-b-2026-09-25/probe-order.js
         ⚠️ 别把 plate.js 挪到它前面：hydrate 要扫一整册的图，实测吃掉 20~50ms。
         🔴 **光靠位置赢不了**：解析器恢复的时刻本身就在飘（同一份文件、同一台机器，
            6 次实验里 3709~3753ms），而快照稳定落在样式表就绪后 ~5ms —— 抢在前面
            纯属运气。让结果**确定**下来的是 head 末尾那枚渲染闸（`#rmRows`）；
            位置在这里的作用是"别让闸多压几十毫秒"：引擎越早排完行，渲染机会越早放行。
       ⚠️ 生成器把 album-strip.js **逐字节**抄进下面 `inline:` 那段（单一真相源）。
          改源文件必须重跑 tools/photos-data.py；stamp.mjs 的 INLINE 检查比字节、
          BOOT 检查比紧随其后的调用 + 渲染闸。 -->
    <!--RM-BEGIN inline:assets/js/album-strip.js--><!--RM-END inline:assets/js/album-strip.js-->
    <script>
      /* 定义完立刻调用。「内联」只等于"代码在页面里"，不等于"跑过" —— 少了这一行，
         几何要等 defer 的 photos.js（= DCL）才落地，快照里就是没排版的散按钮。
         排完给第一行挂 id：head 里那枚渲染闸等的就是它（见页面顶部那段）。 */
      RMAlbumStrip.paint(document.getElementById('albumStrip'));
      (function () {
        var row = document.querySelector('.album-strip-row');
        if (row) { row.id = 'rmRows'; return; }
        /* 没排出行（不该发生）→ 立刻撤闸，宁可退回赛跑也别压着渲染 */
        var l = document.getElementById('rmExpect');
        if (l && l.parentNode) l.parentNode.removeChild(l);
      })();
    </script>

  <!--RM-BEGIN inline:assets/js/plate.js--><!--RM-END inline:assets/js/plate.js-->

  <!-- Skills logo loop 双向引擎（第十批）：rAF 平滑 + hover 减速 + 动态复制份数 -->
  <!-- ⚠️ 为什么这段「兜底」住在 body 末尾（2026-09-25）：它是解析路径上**第一个
       排在样式表之后的内联脚本**，而内联经典脚本会等所有 pending 样式表加载完
       才执行 ⇒ 解析器卡在这里，body 一个字都还没解析。跨文档过渡的新页快照拍在
       pagereveal（= 样式表就绪那一刻的首次绘制）⇒ 快照里是一张只有 head 的空壳，
       整页被洗白。实测（限速 100ms/500KB/s，直接进册页）：
         段在哪 → t600/t1500/pagereveal 三处都 hero=-1、docH=900（body 没解析）
         挪到末尾 → 三处都是 hero=5 shots=6（body 早已解析完）
       它注册的是 load 监听，放哪儿都赶得上，本来就没有"必须靠前"的理由。
       取证：~/.workbuddy/scratch/album-static-b-2026-09-25/probe-direct.js -->

  <script>
    /* 第一百四十五批兜底：loader.js 未加载/异常时（defer 脚本被屏蔽、CDN 404 等），
       load+2s 后强制解除加载页 —— 页面绝不因加载页而不可见。
       正常路径 loader.js 已先完成，此段检查 .page-ready 幂等跳过。 */
    window.addEventListener('load', function () {
      setTimeout(function () {
        var loader = document.getElementById('pageLoader');
        var html = document.documentElement;
        if (!loader || html.classList.contains('page-ready')) return;
        html.classList.remove('page-loading');
        html.classList.add('page-ready');
        try { document.dispatchEvent(new CustomEvent('pageReady')); } catch (e) {}
        loader.classList.add('is-done');
        setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
      }, 2000);
    });
  </script>
