<!-- 导航观感三件套（2026-09-13 主人"参考 tblog.mmzhiku.xyz，优化加载体验与闪烁"）
     ① html 底色内联在 head：style.css 到达前也不会白闪（深色用户不再先白一下）；
        ⚠️ 2026-09-26：亮色串 #ffffff → #f5f5f7。它必须等于 style.css 的 `--color-canvas`
        （画布），**不是** --color-paper —— 两边不同值就会先闪一下 10 级的白。
     ② 站内导航判据：从站内某页点进来（referrer 同源，或用会话标记 rm-visited
        兜底）时给 <html> 加 .nav-instant，
        全屏加载页连第一帧都不画（display:none 见 ../assets/css/loader.css），
        加载页只留给会话的第一次进入做品牌落地；
     ③ speculationrules：悬停站内链接即预取下一页，点击时文档已在 HTTP 缓存里。
     三者都是渐进增强 —— 不支持的浏览器原样走老行为。 -->
<style>
  html { background: #f5f5f7; }
  html.theme-dark { background: #131a26; }

<script>
  (function () {
    var de = document.documentElement;
    var internal = false;
    /* ① 主判据 referrer 同源 = 从站内某页点进来。不依赖任何存储、同步可读 ——
       实测 sessionStorage 在本页 head 里偶发取不到（12 次里 2 次抛错），
       所以存储只当兜底，不当主判据。 */
    try {
      if (document.referrer) {
        var a = document.createElement('a');
        a.href = document.referrer;
        internal = a.origin === location.origin;
      }
    } catch (e) {}
    /* ② 本次会话已经看过至少一页：referrer 被策略剥掉（外部 no-referrer 等）时兜底 */
    try {
      if (sessionStorage.getItem('rm-visited') === '1') internal = true;
      else if (!document.prerendering) sessionStorage.setItem('rm-visited', '1');
    } catch (e) {}
    if (internal) de.classList.add('nav-instant');
  })();
</script>

<!-- === 首绘渲染闸（2026-09-25 第二轮）：把「第一次渲染机会」按住，直到对齐行真的排好 ===
     为什么非要有它：几何是 JS 在解析期算的，而浏览器拍跨文档快照的时机 =
     "样式表就绪后的第一个渲染机会" —— 两者在**赛跑**，而且不是稳赢。
     实测同一份页面同一台机器（限速 100ms/500KB/s，跑 6 次）：解析器恢复的时刻在
     3709~3753ms 之间飘，快照却稳定落在样式表就绪后 ~5ms ⇒ 有时赢、有时输；
     **输的那次快照里是没排版的散按钮**（52 张挤成小格子），过渡结束后才重排成
     对齐行 —— 这正是主人看到的"闪一下"。光把引擎往前挪治不了（见下面几何引擎那段）。
     闸的判据 = `#rmRows`：几何引擎排出来的第一行，id 由照片墙后面那段调用挂上。
     渲染机会因此必然晚于"对齐行就位" ⇒ 快照里就是最终排版。
     加上它之后实测：52 张的册、6 张的册各 5 次，rowsAtPr 全是最终值（5/5 + 5/5）。
     取证：~/.workbuddy/scratch/album-static-b-2026-09-25/probe-order.js
     ⚠️ 自救这件事**已经量过**，别照抄"必须靠定时器"：把引擎的调用换成 `throw`
        （行永远排不出来）再跑 3 次，pagereveal 落在"样式表就绪 +3.4~6ms"——
        闸自己会松开（解析结束时释放），页面照常渲染，只是退回没排版那副样子。
        所以下面那段定时器**不是**主保障，只是多一层网：万一将来的浏览器改了释放时机，
        它还能把渲染放出来。别删，也别把它当"主因"去理解。
     🔴 **位置是量出来的，别"顺手"挪**：闸与保命脚本都必须待在 head **末尾**
        （= 四张样式表之后）。实测三种摆法：
          · 闸 + 保命都放 </head> 之前（= 现在这样）→ 5/5 命中 ✓
          · 闸放 </head> 之前、保命留在样式表之前      → 0/5（闸被无视）
          · 两段都放样式表之前                        → 0/5（闸被无视）
        后两种的差别只在"保命脚本会不会卡在 head 里等样式表" —— 也就是说，闸要生效，
        解析器**必须被那段保命脚本按在 head 里**等样式表。结论反直觉但可复现，
        同一份文件在同一天换了端口重测也一样，所以照抄这个摆法。
     ⚠️ 代价（已量、已知）：解析器改在 head 里等样式表 ⇒ body（含照片墙的 <img>）
        要等样式表就绪才开始解析。**样式表走缓存时无代价**（常态）；冷缓存首访会晚
        一个 CSS 往返。取舍理由：冷缓存首访本来一切都冷，而"快照里排版错位"
        是每次进册页都发生的事。
     ⚠️ 不支持的浏览器直接忽略这枚链接 ⇒ 退回原来的赛跑，不会更糟。 -->
<link rel="expect" id="rmExpect" href="#rmRows" blocking="render">
<script>
  /* 第二层网（1s）：解析结束本来就会释放闸（已实测），正常路径下 #rmRows 也早就存在 ——
     这里什么都不做。留着是防"将来的浏览器改了释放时机"这种远期风险。
     ⚠️ 这段**必须是样式表之后的经典内联脚本**（会卡住解析器）：它不是可有可无的
        定时器 —— "解析器被按在 head 里等样式表"正是闸生效的前提（见上面那条实测）。 */
  setTimeout(function () {
    var l = document.getElementById('rmExpect');
    if (l && !document.getElementById('rmRows') && l.parentNode) l.parentNode.removeChild(l);
  }, 1000);
</script>

  /* ---- 对齐行布局：整册一次算完（DP）----

     输出：每行的 {items, height, fit}（height = 取整后的 DOM 高度；fit = 未取整的渲染高，定宽用）

     polyu / central-wanchai / kai-tak 末行各只剩 1 张、右边空 819px，
     disneyland 整册空洞 1445px、中间还有一行单张被夹到 472px（比邻行矮 64%）。
     现在整册一次算完（DP，N ≤ 60 张，O(N²) 可忽略），代价函数三项相加：

         10000 · ((h − target) / target)²      行高偏离目标的平方
       +   900 · |1 − fill|                   行宽没铺满的比例（= 洞）
       + 12000                                孤张行（整册不止一张时）

      var nat = (avail - gap * (n - 1)) / sum;
      var fit = clamp(nat);
      if (isLast) fit = Math.min(fit, target);
      var fill = (fit * sum + gap * (n - 1)) / avail;
      var c = Math.pow((fit - target) / target, 2) * 10000 + 900 * Math.abs(1 - fill);
      if (n === 1 && N > 1) c += 12000;
      return { h: Math.round(fit), nat: nat, fit: fit, fill: fill, c: c };

    j = N;
    while (j > 0) {
      i = from[j];
      rows.push({ items: items.slice(i, j), height: meta[j].h, fit: meta[j].fit });
      j = i;
    }

  }

      var rowEl = document.createElement('div');
      rowEl.className = 'album-strip-row';
      var row = rows[r];
      for (var k = 0; k < row.items.length; k++) {
        var it = row.items[k];
        it.el.style.height = row.height + 'px';
        /* 宽度按**未取整**的渲染高（row.fit）算再 floor ⇒ 行内各张之和 ≤ 行宽，
           右缘永不撑出容器（用取整后的高度算，那 0.5px 会被每张放大一次，一行能攒出 6px 溢出）。
           高度才取整，行与行之间不会有半像素缝。 */
        it.el.style.width = Math.floor((row.fit != null ? row.fit : row.height) * (it.w / it.h)) + 'px';
        rowEl.appendChild(it.el);
      }
      frag.appendChild(rowEl);

    strip.textContent = '';
    strip.appendChild(frag);
  }

     同时给 CSS 那条兜底当尺寸依据（引擎没跑起来时也不至于是空白）。 */
  function toItems(shots) {
    var items = [];
    for (var i = 0; i < shots.length; i++) {
      var ar = parseFloat(shots[i].style.getPropertyValue('--ar')) || 1.5;
      items.push({ el: shots[i], w: ar, h: 1 });
    }
    return items;
  }

  window.RMAlbumStrip = { paint: paint, layout: rows2layout, targetFor: targetFor, gap: readGap };

   破图图标 + alt，改成底板 + 正中一枚细线图形（规则与色值在 style.css 的「破图兜底」段）。

  var BROKEN_RETRY_MS = 1200;

  var BROKEN_OUTAGE_AT = 3;
  var failStreak = 0;
  var fadedOnce = Object.create(null);

  function brokenMark(img, on) {
